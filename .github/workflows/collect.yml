name: collect-sentiment

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Collect
        env:
          MYFXBOOK_EMAIL:    ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: python collect.py

      - name: Plot
        run: python plot.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add positionbook.csv docs/index.html docs/.nojekyll
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push failed, retry $i"
            git pull --rebase --autostash || true
            sleep 5
          done
          exit 1
